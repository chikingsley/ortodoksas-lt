packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false
  workerd: true
overrides:
  esbuild@<=0.24.2: ^0.28.2
patchedDependencies:
  "@tanstack/react-router@1.170.45": patches/@tanstack__react-router@1.170.45.patch
  vite@8.3.4: patches/vite@8.3.4.patch
  braces@3.0.3: patches/braces@3.0.3.patch
strictPeerDependencies: true

# The pinned local braces patch bounds parsing and all recursive AST walkers.
# tests/braces-security.test.mts exercises this advisory; remove with the upstream release.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Explicit October 20 latest-release update: exact packages within the default
# 24-hour release window. Ordinary future updates retain the age gate.
minimumReleaseAgeExclude:
  - "@clerk/backend@3.26.0"
  - "@clerk/localizations@4.24.0"
  - "@clerk/react@6.18.0"
  - "@clerk/shared@4.41.0"
  - "@clerk/tanstack-react-start@1.7.4"
  - "@clerk/ui@1.41.0"
  - "@cloudflare/vitest-plugin@1.4.6"
  - "lucide-react@1.60.0"
  - "miniflare@5.20261019.1-beta"
  - "wrangler@4.151.3"
