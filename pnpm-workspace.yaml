packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false
  workerd: true
overrides:
  esbuild@<=0.24.2: ^0.28.2
  # ts-morph still asks for a minimatch line inside the vulnerable range.
  minimatch@<11.0.1: ^11.0.1
patchedDependencies:
  "@tanstack/react-router@1.170.46": patches/@tanstack__react-router@1.170.46.patch
  vite@8.3.5: patches/vite@8.3.5.patch
  braces@3.0.3: patches/braces@3.0.3.patch
strictPeerDependencies: true
