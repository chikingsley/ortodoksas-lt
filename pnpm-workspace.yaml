packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false
  workerd: true
overrides:
  esbuild@<=0.24.2: ^0.28.2
patchedDependencies:
  "@tanstack/react-router@1.170.45": patches/@tanstack__react-router@1.170.45.patch
  vite@8.3.4: patches/vite@8.3.4.patch
  braces@3.0.3: patches/braces@3.0.3.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# The pinned local braces patch bounds parsing and all recursive AST walkers.
# tests/braces-security.test.mts exercises this advisory; remove with the upstream release.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Explicit 2026-10-19 Cloudflare upgrade: exact versions released within pnpm's
# 24-hour default window. Ordinary dependency updates retain the age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261019.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261019.1"
  - "@cloudflare/workerd-linux-64@1.20261019.1"
  - "@cloudflare/workerd-linux-arm64@1.20261019.1"
  - "@cloudflare/workerd-windows-64@1.20261019.1"
  - miniflare@5.20261019.0-beta
  - workerd@1.20261019.1
  - wrangler@4.151.2
