backend:
  name: github
  repo: chikingsley/ortodoksas-revival
  branch: main
  base_url: https://ortodoksas.grassinside.com
  auth_endpoint: api/auth
  auth_scope: repo
  squash_merges: true

local_backend:
  url: http://localhost:8081/api/v1

publish_mode: editorial_workflow
media_folder: public/media
public_folder: /media

i18n:
  structure: multiple_folders
  locales: [lt, en, ru, uk, be]
  default_locale: lt

collections:
  - name: publications
    label: Publications
    label_singular: Publication
    folder: public/content/editorial
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}} · {{published}}"
    i18n: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Slug, name: slug, widget: string, i18n: duplicate }
      - { label: Section, name: section, widget: string, i18n: true }
      - { label: Description, name: description, widget: text, i18n: true }
      - { label: Published, name: published, widget: datetime, i18n: duplicate }
      - { label: Hero image, name: hero, widget: image, required: false, i18n: duplicate }
      - { label: Body, name: body, widget: markdown, i18n: true }
