backend:
  name: github
  repo: chikingsley/ortodoksas-revival
  branch: main
  base_url: /api
  auth_endpoint: auth

local_backend:
  url: http://localhost:8081/api/v1

publish_mode: editorial_workflow
media_folder: public/media
public_folder: /media

collections:
  - name: publications
    label: Publications
    label_singular: Publication
    folder: public/content/editorial
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [lt, en, ru, uk, be]
      default_locale: lt
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string }
      - { label: Locale, name: locale, widget: select, options: [lt, en, ru, uk, be] }
      - { label: Section, name: section, widget: string, required: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Published, name: published, widget: datetime, required: false }
      - { label: Hero image, name: hero, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }
